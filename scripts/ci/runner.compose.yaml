name: lhs-ci
services:
  runner:
    image: lhs-actions-runner:isolated
    container_name: lhs-ci-runner
    restart: unless-stopped
    init: true
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 768
    security_opt: [no-new-privileges:true]
    cap_drop: [NET_RAW, MKNOD]
    volumes:
      - runner_data:/runner
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /run:size=32m,mode=0755
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
    healthcheck:
      test: [CMD-SHELL, "pgrep -x Runner.Listener >/dev/null && curl -fsSI --max-time 5 https://github.com >/dev/null"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 2
    networks: [ci]
networks:
  ci: {}
volumes:
  runner_data:
    name: lhs_ci_runner_data
