<div class="save-actions" aria-label="Transferir progresso">
  <button type="button" id="save-export" data-icon="save">Salvar em arquivo</button>
  <button type="button" id="save-import" data-icon="upload">Carregar arquivo</button>
  <input type="file" id="save-import-file" accept=".json,application/json"
    hidden aria-label="Selecionar arquivo de partida"/>
</div>
<p id="save-message" class="save-message" role="status" aria-live="polite">
  Seu progresso fica salvo neste navegador.
</p>
