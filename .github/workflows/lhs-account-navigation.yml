name: LHS account navigation
on:
  pull_request:
    paths:
      - 'games/lan_house_simulator/website/**'
      - 'games/lan_house_simulator/src/ui/cloudControls.ts'
      - 'games/lan_house_simulator/src/ui/accountClient.d.ts'
      - 'games/lan_house_simulator/online-config.json'
      - 'games/lan_house_simulator/scripts/build.mjs'
      - 'games/lan_house_simulator/scripts/verify_account_navigation.mjs'
      - '.github/workflows/lhs-account-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'games/lan_house_simulator/website/**'
      - 'games/lan_house_simulator/src/ui/cloudControls.ts'
      - 'games/lan_house_simulator/src/ui/accountClient.d.ts'
      - 'games/lan_house_simulator/online-config.json'
      - 'games/lan_house_simulator/scripts/build.mjs'
      - 'games/lan_house_simulator/scripts/verify_account_navigation.mjs'
      - '.github/workflows/lhs-account-navigation.yml'
permissions:
  contents: read
jobs:
  navigation:
    # Playwright 1.56.1 supports 24.04; ubuntu-latest can advance independently.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/lan_house_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build:site && npm run check:site
      - run: node --test tests/account-client.test.mjs tests/donate.test.mjs tests/email-confirmation.test.mjs tests/website.test.mjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify_account_navigation.mjs
      - run: node scripts/verify_account_panel.mjs
