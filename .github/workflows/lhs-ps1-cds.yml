name: LHS - PS1 CDs and admin panel
on:
  pull_request:
    paths:
      - 'games/lan_house_simulator/src/sim/ps1.ts'
      - 'games/lan_house_simulator/src/application/ps1ShopDiscPort.ts'
      - 'games/lan_house_simulator/src/ui/ps1CoverArt.ts'
      - 'games/lan_house_simulator/src/ui/ps1ShopDiscCatalog.ts'
      - 'games/lan_house_simulator/src/render/ps1MiniGames.ts'
      - 'games/lan_house_simulator/assets/ps1/covers/**'
      - 'games/lan_house_simulator/tests/ps1-*.test.mjs'
      - '.github/workflows/lhs-ps1-cds.yml'
  push:
    paths:
      - 'games/lan_house_simulator/src/sim/ps1.ts'
      - 'games/lan_house_simulator/assets/ps1/covers/**'
      - 'games/lan_house_simulator/src/sim/types.ts'
      - 'games/lan_house_simulator/src/sim/engine.ts'
      - 'games/lan_house_simulator/src/main.ts'
      - 'games/lan_house_simulator/src/sim/shop.ts'
      - 'games/lan_house_simulator/index.html'
      - 'games/lan_house_simulator/style.css'
      - 'games/lan_house_simulator/tests/ps1-2002.test.mjs'
      - 'games/lan_house_simulator/tests/ps1-two-players.test.mjs'
      - 'games/lan_house_simulator/scripts/ps1_real_cycle.mjs'
      - 'games/lan_house_simulator/scripts/ps1_crowded_cycle.mjs'
      - '.github/workflows/lhs-ps1-cds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps1-cds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: games/lan_house_simulator/package-lock.json
      - name: Install game dependencies
        working-directory: games/lan_house_simulator
        run: npm ci --no-audit --no-fund
      - name: Build TypeScript and browser assets
        working-directory: games/lan_house_simulator
        run: npm run build
      - name: Validate physical PS1 CD economy and simultaneous NPC sessions
        working-directory: games/lan_house_simulator
        run: node --test tests/ps1-2002.test.mjs tests/ps1-two-players.test.mjs tests/ps1-shop-disc-boundary.test.mjs tests/ps1-procedural-cover.test.mjs tests/ps1-yearly-catalog.test.mjs
