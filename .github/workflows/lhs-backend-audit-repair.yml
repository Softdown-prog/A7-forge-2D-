name: LHS Backend Dependency Security Repair
on:
  push:
    branches:
      - feat/lhs-ps2-2006-integrated
    paths:
      - .github/workflows/lhs-backend-audit-repair.yml
      - games/lan_house_simulator/backend/package.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-backend-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: games/lan_house_simulator/backend/package-lock.json
      - name: Repair backend dependencies without bypassing security checks
        working-directory: games/lan_house_simulator/backend
        run: |
          # Refresh the lockfile from explicit patched-range overrides.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/*.test.mjs
          npm audit --omit=dev
      - name: Commit verified backend lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/lan_house_simulator/backend/package.json games/lan_house_simulator/backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(lhs): atualizar dependências transitivas vulneráveis do backend"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
