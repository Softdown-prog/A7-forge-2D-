name: LHS clean Angular rewrite (isolated, no deploy)
on:
  pull_request:
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lhs-clean-angular-rewrite.yml'
  push:
    branches: ['rewrite/lhs-angular-site-clean', 'feat/lhs-angular-next-stage-20261101']
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lhs-clean-angular-rewrite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent game and Angular toolchains
        working-directory: games/lan_house_simulator
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend-angular --no-audit --no-fund
      - name: Build clean Angular-only static artifact
        working-directory: games/lan_house_simulator
        run: |
          npm run build:site:clean
          npm run check:site:clean
          node --test tests/clean-site-legal.test.mjs tests/clean-site-canonical.test.mjs tests/clean-site-local-data.test.mjs tests/clean-site-account.test.mjs tests/clean-site-email-confirmation.test.mjs tests/clean-site-donate.test.mjs tests/clean-site-donate-history.test.mjs
      - name: Real Chromium Android-like touch, F5 and iframe QA
        working-directory: games/lan_house_simulator
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/verify_clean_angular_confirmation.mjs
          node scripts/verify_clean_angular_account.mjs
          node scripts/verify_clean_angular_site.mjs
      - name: Save browser evidence — research only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhs-clean-angular-browser-evidence
          path: games/lan_house_simulator/out/site-clean-angular-browser
          if-no-files-found: ignore
