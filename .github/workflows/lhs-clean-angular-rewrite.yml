name: LHS clean Angular rewrite (isolated, no deploy)
on:
  pull_request:
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lhs-clean-angular-rewrite.yml'
  push:
    branches: ['rewrite/lhs-angular-site-clean', 'feat/lhs-angular-next-stage-20261101']
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lhs-clean-angular-rewrite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-24.04
      requires_docker: true
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  rewrite:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install independent game and Angular toolchains
        working-directory: games/lan_house_simulator
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend-angular --no-audit --no-fund
      - name: Install backend contract toolchain and isolated Chromium
        working-directory: games/lan_house_simulator
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate complete migration, engine, accounts and payment contracts
        working-directory: games/lan_house_simulator
        run: npm run validate:site:clean
      - name: Save canonical Angular staging artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: lhs-angular-staging-${{ github.sha }}
          path: games/lan_house_simulator/out/site
          if-no-files-found: error
          retention-days: 14
      - name: Save validation and browser evidence — no production deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhs-clean-angular-browser-evidence
          path: games/lan_house_simulator/out/site-clean-angular-browser
          if-no-files-found: ignore

  frontend-container:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/lan_house_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build default Angular frontend image
        run: docker build -t lhs-frontend:test .
      - name: Validate immutable frontend container with Chromium
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name lhs-frontend-test --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8081:8080 lhs-frontend:test
          trap 'docker logs lhs-frontend-test; docker stop lhs-frontend-test' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8081/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/health
          LHS_SITE_PREVIEW_URL=http://127.0.0.1:8081 node scripts/verify_clean_angular_migration.mjs
          test "$(docker inspect --format '{{.Config.User}}' lhs-frontend-test)" = node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhs-angular-container-evidence
          path: games/lan_house_simulator/out/site-clean-angular-browser
