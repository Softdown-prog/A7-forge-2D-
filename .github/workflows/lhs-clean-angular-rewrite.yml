name: LHS clean Angular rewrite (isolated, no deploy)
on:
  pull_request:
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lhs-clean-angular-rewrite.yml'
  push:
    branches: ['rewrite/lhs-angular-site-clean', 'feat/lhs-angular-next-stage-20261101']
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lhs-clean-angular-rewrite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install independent game and Angular toolchains
        working-directory: games/lan_house_simulator
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend-angular --no-audit --no-fund
      - name: Install backend contract toolchain and isolated Chromium
        working-directory: games/lan_house_simulator
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate complete migration, engine, accounts and payment contracts
        working-directory: games/lan_house_simulator
        run: npm run validate:site:clean
      - name: Save canonical Angular staging artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: lhs-angular-staging-${{ github.sha }}
          path: games/lan_house_simulator/out/site-clean-angular
          if-no-files-found: error
          retention-days: 14
      - name: Save validation and browser evidence — no production deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhs-clean-angular-browser-evidence
          path: games/lan_house_simulator/out/site-clean-angular-browser
          if-no-files-found: ignore
