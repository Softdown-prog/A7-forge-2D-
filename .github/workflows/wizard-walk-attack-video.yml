name: Wizard walk and attack video
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/visitor_forge_2d/scripts/wizard_walk_attack_video.py'
      - 'tools/visitor_forge_2d/examples/pixel_character_wizard_mini_01.json'
      - '.github/workflows/wizard-walk-attack-video.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e tools/visitor_forge_2d
      - name: Render canonical wizard
        run: python -m visitor_forge_2d render-pixel-character --recipe tools/visitor_forge_2d/examples/pixel_character_wizard_mini_01.json --output out/wizard
      - name: Create walk and attack MP4
        run: python tools/visitor_forge_2d/scripts/wizard_walk_attack_video.py --source out/wizard --output out/wizard_video
      - uses: actions/upload-artifact@v4
        with:
          name: a7-wizard-walk-and-attack-mp4
          path: out/wizard_video/
          if-no-files-found: error
