name: Lan House Simulator - worker pool
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lan-house-simulator.yml'
  pull_request:
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lan-house-simulator.yml'

permissions:
  contents: read

jobs:
  small-worker-pool:
    name: worker-${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        worker: [simulation, scene, forge-art]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        if: matrix.worker != 'forge-art'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        if: matrix.worker != 'forge-art'
        working-directory: games/lan_house_simulator
        run: npm install --no-audit --no-fund
      - name: Validate simulation
        if: matrix.worker == 'simulation'
        working-directory: games/lan_house_simulator
        run: npm test
      - name: Audit 90-day GPU license costs and actual game demand
        if: matrix.worker == 'simulation'
        working-directory: games/lan_house_simulator
        run: npm run audit:gpu-licenses
      - name: Audit historical GPU tariffs at 3 legal price levels
        if: matrix.worker == 'simulation'
        working-directory: games/lan_house_simulator
        run: npm run audit:gpu-pricing
      - name: Upload controlled 90-day tariff comparison
        if: matrix.worker == 'simulation'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-gpu-tariff-90day-audit
          path: games/lan_house_simulator/out/audits/gpu-price-comparison-90day.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload controlled 90-day GPU license audit
        if: matrix.worker == 'simulation'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-gpu-license-90day-audit
          path: games/lan_house_simulator/out/audits/gpu-license-90-day.json
          if-no-files-found: error
          retention-days: 14
      - name: Run extensive 360-day economy audit on manual workflow dispatch
        if: matrix.worker == 'simulation' && github.event_name == 'workflow_dispatch'
        working-directory: games/lan_house_simulator
        run: npm run audit:annual
      - name: Build playable scene
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          npm run build
          npm run audit
      - name: Build standalone website and validate routes and metadata
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          npm run build:site
          npm run check:site
      - name: Install Chromium for real Canvas validation
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Confirmar balcão real nas prévias do site desktop e mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_live_site_preview.mjs
      - name: Capture actual runtime desktop and mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_scene.mjs out/validation
      - name: Verify cached scenery against the original drawing
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_rendering.mjs out/validation
      - name: Inspect actor directions, costumes and pose transitions
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_actor_volume.mjs out/validation
      - name: Inspect original posters and paid wall placements
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_poster_art.mjs out/validation
      - name: Inspect workstation art, seated hands and sprite cache
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_computer_art.mjs out/validation
      - name: Verify five LCD generations, release years and paid station upgrades
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_lcd_generations.mjs out/validation
      - name: Verify per-PC components, Windows requirements and legacy stations
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_hardware_ui.mjs out/validation
      - name: Verify retail sprites, live stock and customer purchases
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_retail_art.mjs out/validation
      - name: Verify touch layout editing, rotations and partition confirmation
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_layout_editor.mjs out/validation
      - name: Verify mobile scrolling, stable administration controls and soda playback
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_mobile_interface.mjs out/validation

      - name: Verify management task pages and drawing during scroll
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_management_panels.mjs out/validation
      - name: Verify 2002 PlayStation shop, bench and admin on desktop/mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_ps1_2002.mjs out/validation
      - name: Verify cash and net-result explanation on desktop and mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_financial_clarity.mjs out/validation
      - name: Verify animated broom strokes and technician repair gestures in four views
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_worker_motion.mjs out/validation
      - name: Verify cleaner and technician work phases in Canvas and mobile admin
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_staff_phases.mjs out/validation
      - name: Verify 2004 school uniform letter, branching decisions and mobile saves
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_uniform_2004.mjs out/validation
      - name: Verify 2004 to 2005 historic mail transition and persistent choices on desktop/mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_historical_mail_transition.mjs out/validation
      - name: Verify GPU game demand metrics on actual desktop and mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_gpu_demand_ui.mjs out/validation
      - name: Verify service access warnings and map overlays on desktop and mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_service_access.mjs out/validation
      - name: Verify paid-only worked days, historic payroll and mobile staff controls
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_employee_workdays.mjs out/validation
      - name: Validate service profitability, historical prices and mobile accounting
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_service_economy.mjs out/validation
      - name: Verify purchasable printer art, Tony gesture and responsive catalog
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_printer_tony.mjs out/validation
      - name: Verify disc copier counter art, Tony gesture and four rotations
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_disc_copier_tony.mjs out/validation
      - name: Verify disc-copy-only customers, cashflow and responsive UI
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_disc_walkins.mjs out/validation
      - name: Verify paid walk-in printing, checkout and responsive financial UI
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_print_walkins.mjs out/validation
      - name: Verify recovered long-campaign saves, quota alerts and mobile retry
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_save_recovery.mjs out/validation
      - name: Inspect administrator and counter art in four orientations
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_counter_art.mjs out/validation
      - name: Verify CD and DVD copier unlock, purchase, prices and mobile controls
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_disc_copy.mjs out/validation
      - name: Record actual employee full cycle and service blockage diagnostics
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/record_staff_diagnostics.mjs out/validation
      - name: Record continuous Chromium gameplay and encode MP4
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node scripts/record_gameplay.mjs out/live-video
          ffmpeg -hide_banner -loglevel error -y -i out/live-video/lan_house_gameplay_live.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 24 \
            -movflags +faststart out/live-video/lan_house_gameplay_live.mp4
          test -s out/live-video/lan_house_gameplay_live.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/validation/worker_actions.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 23 \
            -movflags +faststart out/live-video/worker_actions.mp4
          test -s out/live-video/worker_actions.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.7 -i out/validation/staff_full_cycle.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 23 \
            -movflags +faststart out/live-video/staff_full_cycle.mp4
          test -s out/live-video/staff_full_cycle.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.7 -i out/validation/service_blockages.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 23 \
            -movflags +faststart out/live-video/service_blockages.mp4
          test -s out/live-video/service_blockages.mp4
      - name: Record continuous circulation through divided rooms
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_circulation.mjs out/validation
      - name: Validate the original visual identity and record its workspaces
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_identity.mjs out/identity --video
      - name: Upload original interface review
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-visual-identity
          path: games/lan_house_simulator/out/identity/
          if-no-files-found: error
          retention-days: 7
      - name: Upload actual gameplay MP4
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-real-gameplay-video
          path: games/lan_house_simulator/out/live-video/*.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Upload Canvas visual validation
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-visual-validation
          path: games/lan_house_simulator/out/validation/
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone game
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-playable-build
          path: games/lan_house_simulator/dist/
          retention-days: 7
      - name: Upload standalone game website
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-standalone-website
          path: games/lan_house_simulator/out/site/
          if-no-files-found: error
          retention-days: 7
      - name: Setup Python
        if: matrix.worker == 'forge-art'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install A7 renderer
        if: matrix.worker == 'forge-art'
        run: python -m pip install -e tools/visitor_forge_2d
      - name: Render vending machine staging candidate
        if: matrix.worker == 'forge-art'
        run: |
          python -m visitor_forge_2d draw-recipe \
            --recipe games/lan_house_simulator/authoring/recipes/vending_machine_study.json \
            --output out/lhs-forge/vending
      - name: Upload art review (not approved)
        if: matrix.worker == 'forge-art'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-forge-review
          path: out/lhs-forge/
          retention-days: 7
