name: Lan House Simulator - worker pool
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lan-house-simulator.yml'
  pull_request:
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lan-house-simulator.yml'

permissions:
  contents: read

jobs:
  small-worker-pool:
    name: worker-${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        worker: [simulation, scene, forge-art]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        if: matrix.worker != 'forge-art'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        if: matrix.worker != 'forge-art'
        working-directory: games/lan_house_simulator
        run: npm install --no-audit --no-fund
      - name: Validate simulation
        if: matrix.worker == 'simulation'
        working-directory: games/lan_house_simulator
        run: npm test
      - name: Run extensive 360-day economy audit on manual workflow dispatch
        if: matrix.worker == 'simulation' && github.event_name == 'workflow_dispatch'
        working-directory: games/lan_house_simulator
        run: npm run audit:annual
      - name: Build playable scene
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          npm run build
          npm run audit
      - name: Build standalone website and validate routes and metadata
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          npm run build:site
          npm run check:site
      - name: Install Chromium for real Canvas validation
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual runtime desktop and mobile
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_scene.mjs out/validation
      - name: Verify cached scenery against the original drawing
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_rendering.mjs out/validation
      - name: Inspect actor directions, costumes and pose transitions
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_actor_volume.mjs out/validation
      - name: Inspect original posters and paid wall placements
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_poster_art.mjs out/validation
      - name: Inspect workstation art, seated hands and sprite cache
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_computer_art.mjs out/validation
      - name: Verify five LCD generations, release years and paid station upgrades
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_lcd_generations.mjs out/validation
      - name: Verify per-PC components, Windows requirements and legacy stations
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_hardware_ui.mjs out/validation
      - name: Verify retail sprites, live stock and customer purchases
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_retail_art.mjs out/validation
      - name: Verify touch layout editing, rotations and partition confirmation
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_layout_editor.mjs out/validation
      - name: Verify mobile scrolling, stable administration controls and soda playback
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/verify_mobile_interface.mjs out/validation
      - name: Inspect administrator and counter art in four orientations
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_counter_art.mjs out/validation
      - name: Record continuous Chromium gameplay and encode MP4
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node scripts/record_gameplay.mjs out/live-video
          ffmpeg -hide_banner -loglevel error -y -i out/live-video/lan_house_gameplay_live.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 24 \
            -movflags +faststart out/live-video/lan_house_gameplay_live.mp4
          test -s out/live-video/lan_house_gameplay_live.mp4
      - name: Record continuous circulation through divided rooms
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_circulation.mjs out/validation
      - name: Validate the original visual identity and record its workspaces
        if: matrix.worker == 'scene'
        working-directory: games/lan_house_simulator
        run: node scripts/capture_identity.mjs out/identity --video
      - name: Upload original interface review
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-visual-identity
          path: games/lan_house_simulator/out/identity/
          if-no-files-found: error
          retention-days: 7
      - name: Upload actual gameplay MP4
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-real-gameplay-video
          path: games/lan_house_simulator/out/live-video/lan_house_gameplay_live.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Upload Canvas visual validation
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-visual-validation
          path: games/lan_house_simulator/out/validation/
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone game
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-playable-build
          path: games/lan_house_simulator/dist/
          retention-days: 7
      - name: Upload standalone game website
        if: matrix.worker == 'scene'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-standalone-website
          path: games/lan_house_simulator/out/site/
          if-no-files-found: error
          retention-days: 7
      - name: Setup Python
        if: matrix.worker == 'forge-art'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install A7 renderer
        if: matrix.worker == 'forge-art'
        run: python -m pip install -e tools/visitor_forge_2d
      - name: Render vending machine staging candidate
        if: matrix.worker == 'forge-art'
        run: |
          python -m visitor_forge_2d draw-recipe \
            --recipe games/lan_house_simulator/authoring/recipes/vending_machine_study.json \
            --output out/lhs-forge/vending
      - name: Upload art review (not approved)
        if: matrix.worker == 'forge-art'
        uses: actions/upload-artifact@v4
        with:
          name: lhs-forge-review
          path: out/lhs-forge/
          retention-days: 7
