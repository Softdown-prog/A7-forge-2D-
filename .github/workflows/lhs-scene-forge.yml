name: LHS Scene Forge - PS1 customer cycle
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/lan_house_simulator/scripts/render_ps1_scene.mjs'
      - 'games/lan_house_simulator/scripts/render_ps1_navigation.mjs'
      - 'games/lan_house_simulator/scripts/ps1_real_cycle.mjs'
      - 'games/lan_house_simulator/scripts/ps1_crowded_cycle.mjs'
      - 'games/lan_house_simulator/scripts/render_ps1_crowded.mjs'
      - 'games/lan_house_simulator/tests/ps1-2002.test.mjs'
      - 'games/lan_house_simulator/src/sim/engine.ts'
      - 'games/lan_house_simulator/src/sim/ps1.ts'
      - 'games/lan_house_simulator/src/render/ps1Art.ts'
      - 'games/lan_house_simulator/src/render/actorArt.ts'
      - 'games/lan_house_simulator/src/render/scene.ts'
      - '.github/workflows/lhs-scene-forge.yml'
permissions:
  contents: read
jobs:
  ps1-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game and browser tools
        working-directory: games/lan_house_simulator
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build real LHS renderer
        working-directory: games/lan_house_simulator
        run: npm run build
      - name: Check PS1 real routes, seating, video games and console-only business
        working-directory: games/lan_house_simulator
        run: node --test tests/ps1-2002.test.mjs
      - name: Capture PS1 scene without campaign or checkout
        working-directory: games/lan_house_simulator
        run: node scripts/render_ps1_scene.mjs out/forge-ps1
      - name: Capture actual PS1 NPC route and session without checkout UI
        working-directory: games/lan_house_simulator
        run: node scripts/render_ps1_navigation.mjs out/forge-ps1
      - name: Capture two PS1 customers using actual simultaneous NPC paths
        working-directory: games/lan_house_simulator
        run: node scripts/render_ps1_crowded.mjs out/forge-ps1
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Encode mobile-friendly MP4
        working-directory: games/lan_house_simulator
        run: |
          ffmpeg -hide_banner -loglevel error -y -i out/forge-ps1/ps1_cliente_ciclo.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 22 \
            -movflags +faststart out/forge-ps1/ps1_cliente_ciclo.mp4
          test -s out/forge-ps1/ps1_cliente_ciclo.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/forge-ps1/ps1_cliente_navegacao_real.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 22 \
            -movflags +faststart out/forge-ps1/ps1_cliente_navegacao_real.mp4
          test -s out/forge-ps1/ps1_cliente_navegacao_real.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/forge-ps1/ps1_dois_clientes.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 22 \
            -movflags +faststart out/forge-ps1/ps1_dois_clientes.mp4
          test -s out/forge-ps1/ps1_dois_clientes.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: lhs-scene-forge-ps1-video
          path: |
            games/lan_house_simulator/out/forge-ps1/ps1_cliente_ciclo.mp4
            games/lan_house_simulator/out/forge-ps1/ps1_cliente_navegacao_real.mp4
            games/lan_house_simulator/out/forge-ps1/ps1_dois_clientes.mp4
            games/lan_house_simulator/out/forge-ps1/ps1_dois_clientes_*.png
            games/lan_house_simulator/out/forge-ps1/ps1_dois_clientes_trace.json
            games/lan_house_simulator/out/forge-ps1/ps1_real_*.png
            games/lan_house_simulator/out/forge-ps1/ps1_navegacao_trace.json
            games/lan_house_simulator/out/forge-ps1/ps1_cliente_*.png
          if-no-files-found: error
          retention-days: 14
