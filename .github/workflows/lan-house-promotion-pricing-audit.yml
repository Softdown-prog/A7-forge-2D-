name: Lan House historical promotion and pricing audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-latest
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  promotion-pricing-audit:
    name: audit-promotions-pricing-1998
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        working-directory: games/lan_house_simulator
        run: npm install --no-audit --no-fund
      - name: Compare 18 180-day real-engine campaigns
        working-directory: games/lan_house_simulator
        run: npm run audit:promotions
