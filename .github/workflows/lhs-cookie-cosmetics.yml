name: LHS - Cookies premium art validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/lan_house_simulator/src/sim/premiumCosmetics.ts'
      - 'games/lan_house_simulator/src/render/retroComputer.ts'
      - 'games/lan_house_simulator/src/render/actorArt.ts'
      - 'games/lan_house_simulator/src/render/scene.ts'
      - 'games/lan_house_simulator/src/render/neonOpenArt.ts'
      - 'games/lan_house_simulator/src/render/premiumRoomArt.ts'
      - 'games/lan_house_simulator/src/ui/cloudControls.ts'
      - 'games/lan_house_simulator/tests/cookie-cosmetics.test.mjs'
      - 'games/lan_house_simulator/scripts/render_cookie_cosmetics.mjs'
      - 'games/lan_house_simulator/scripts/render_cookie_keyboard_sign.mjs'
      - 'games/lan_house_simulator/scripts/render_cookie_floor_posters.mjs'
      - '.github/workflows/lhs-cookie-cosmetics.yml'
permissions:
  contents: read
jobs:
  cookie-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install npm dependencies
        working-directory: games/lan_house_simulator
        run: npm ci --no-audit --no-fund
      - name: Compile gameplay and renderer
        working-directory: games/lan_house_simulator
        run: npm run build
      - name: Check premium ownership, financial isolation and headset decisions
        working-directory: games/lan_house_simulator
        run: node --test tests/cookie-cosmetics.test.mjs
      - name: Install browser
        working-directory: games/lan_house_simulator
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render actual game furniture, actor and animated headset
        working-directory: games/lan_house_simulator
        run: node scripts/render_cookie_cosmetics.mjs out/cookie-art
      - name: Render Rainbow RGB keyboard and open neon sign in actual room
        working-directory: games/lan_house_simulator
        run: node scripts/render_cookie_keyboard_sign.mjs out/cookie-art
      - name: Compare premium room cosmetics and revocation in real game scene
        working-directory: games/lan_house_simulator
        run: node scripts/render_cookie_floor_posters.mjs out/cookie-art
      - name: Encode premium art preview video
        working-directory: games/lan_house_simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y -i out/cookie-art/cookies_cadeira_fone_preview.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 21 \
            -movflags +faststart out/cookie-art/cookies_cadeira_fone_preview.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/cookie-art/cookies_teclado_placa_preview.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 21 \
            -movflags +faststart out/cookie-art/cookies_teclado_placa_preview.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/cookie-art/cookies_piso_posters_apresentacao.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 23 \
            -movflags +faststart out/cookie-art/cookies_piso_posters_apresentacao.mp4
          test -s out/cookie-art/cookies_piso_posters_comparacao.png
          test -s out/cookie-art/cookies_piso_posters_salao.png
          test -s out/cookie-art/cookies_piso_posters_apresentacao.mp4
          test -s out/cookie-art/cookies_teclado_placa_preview.png
          test -s out/cookie-art/cookies_neon_porta_aberta.png
          test -s out/cookie-art/cookies_neon_porta_fechando.png
          test -s out/cookie-art/cookies_teclado_placa_preview.mp4
          test -s out/cookie-art/cookies_cadeira_fone_preview.png
          test -s out/cookie-art/cookies_cadeira_fone_detalhes.png
          test -s out/cookie-art/cookies_cadeira_fone_preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: lhs-cookies-premium-art-prototype
          path: |
            games/lan_house_simulator/out/cookie-art/cookies_cadeira_fone_preview.png
            games/lan_house_simulator/out/cookie-art/cookies_cadeira_fone_detalhes.png
            games/lan_house_simulator/out/cookie-art/cookies_cadeira_fone_preview.mp4
            games/lan_house_simulator/out/cookie-art/cookies_teclado_placa_preview.png
            games/lan_house_simulator/out/cookie-art/cookies_neon_porta_aberta.png
            games/lan_house_simulator/out/cookie-art/cookies_neon_porta_fechando.png
            games/lan_house_simulator/out/cookie-art/cookies_teclado_placa_preview.mp4
            games/lan_house_simulator/out/cookie-art/cookies_piso_posters_comparacao.png
            games/lan_house_simulator/out/cookie-art/cookies_piso_posters_salao.png
            games/lan_house_simulator/out/cookie-art/cookies_piso_posters_salao_antes.png
            games/lan_house_simulator/out/cookie-art/cookies_piso_posters_apresentacao.mp4
          retention-days: 30
          if-no-files-found: error
