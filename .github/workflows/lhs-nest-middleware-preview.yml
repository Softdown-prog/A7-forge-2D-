name: LHS Nest middleware preview (isolated, no deploy)

on:
  push:
    branches:
      - "feat/lhs-nest-*"
    paths:
      - "games/lan_house_simulator/backend/nest-preview/**"
      - "games/lan_house_simulator/tests/nest-middleware-foundation.test.mjs"
      - ".github/workflows/lhs-nest-middleware-preview.yml"
  pull_request:
    paths:
      - "games/lan_house_simulator/backend/nest-preview/**"
      - "games/lan_house_simulator/tests/nest-middleware-foundation.test.mjs"
      - ".github/workflows/lhs-nest-middleware-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lhs-nest-middleware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-24.04
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  nest-middleware-preview:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - name: Verify backend separation and middleware source contracts
        run: node --test games/lan_house_simulator/tests/nest-middleware-foundation.test.mjs
      - name: Reproducible install from reviewed and committed package-lock.json
        working-directory: games/lan_house_simulator/backend/nest-preview
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile strict TypeScript NestJS preview
        working-directory: games/lan_house_simulator/backend/nest-preview
        run: npm run build
      - name: Test real local NestJS middleware HTTP behavior
        working-directory: games/lan_house_simulator/backend/nest-preview
        run: npm run test
      - name: Configure JDK 21 for official Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test quota against real local Firestore emulator
        working-directory: games/lan_house_simulator/backend/nest-preview
        env:
          LHS_NEST_EMULATOR_ENABLED: "1"
        run: npm run test:emulator:ci
