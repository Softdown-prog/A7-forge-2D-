name: LHS | selecionar runner VPS com fallback
on:
  workflow_call:
    inputs:
      hosted_label:
        type: string
        default: ubuntu-24.04
      requires_docker:
        description: Docker jobs use GitHub; the CI runner has no production socket.
        type: boolean
        default: false
    secrets:
      runner_status_token:
        description: Dedicated read-only SSH probe key, or Administration/read PAT.
        required: false
    outputs:
      runner_labels:
        value: ${{ jobs.select.outputs.runner_labels }}
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      runner_labels: ${{ steps.route.outputs.runner_labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Select isolated VPS only for admitted events and compatible jobs
        id: route
        env:
          HOSTED_LABEL: ${{ inputs.hosted_label }}
          REQUIRES_DOCKER: ${{ inputs.requires_docker }}
          STATUS_TOKEN: ${{ secrets.runner_status_token }}
          # Off unless the repository variable is exactly 'true'; GitHub-hosted is the default.
          LHS_USE_VPS_RUNNER: ${{ vars.LHS_USE_VPS_RUNNER }}
        run: python3 scripts/ci/runner-policy.py
