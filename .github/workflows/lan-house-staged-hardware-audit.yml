name: Lan House staged hardware ROI audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-latest
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  staged-hardware:
    name: audit-staged-2005-2012
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        working-directory: games/lan_house_simulator
        run: npm install --no-audit --no-fund
      - name: Test 20 real 240-day campaigns
        working-directory: games/lan_house_simulator
        run: npm run audit:staged-hardware
