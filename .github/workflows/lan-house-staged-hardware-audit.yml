name: Lan House staged hardware ROI audit
on:
  workflow_dispatch:
  push:
    branches:
      - test/lhs-staged-hardware-2005-2012-20261014
    paths:
      - 'games/lan_house_simulator/tests/staged-hardware-roi.test.mjs'
      - 'games/lan_house_simulator/package.json'
      - '.github/workflows/lan-house-staged-hardware-audit.yml'
permissions:
  contents: read
jobs:
  staged-hardware:
    name: audit-staged-2005-2012
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        working-directory: games/lan_house_simulator
        run: npm install --no-audit --no-fund
      - name: Test 20 real 240-day campaigns
        working-directory: games/lan_house_simulator
        run: npm run audit:staged-hardware
