name: Lan House historical growth audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-latest
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  growth-campaigns:
    name: audit-growth-1998-2000
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install compiler
        working-directory: games/lan_house_simulator
        run: npm install --no-audit --no-fund
      - name: Run 3/5/7-PC campaigns and two annual rollovers
        working-directory: games/lan_house_simulator
        run: npm run audit:growth
