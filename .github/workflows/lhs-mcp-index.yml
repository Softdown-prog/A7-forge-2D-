name: LHS MCP repository index

on:
  push:
    branches: ["feat/lhs-angular-ui-foundation"]
  workflow_dispatch:
    inputs:
      scope:
        description: "Repository scope to index (game or entire repository)"
        required: true
        default: "repository"
        type: choice
        options: [repository, game]

permissions:
  contents: read

concurrency:
  group: lhs-mcp-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify MCP safety, indexing and JSON-RPC stdio
        run: node --test tools/lhs-mcp/*.test.mjs
      - name: Restore previous catalog for incremental indexing
        id: cache-index
        uses: actions/cache/restore@v4
        with:
          path: out/lhs-mcp-cache/catalog.json
          key: lhs-mcp-v3-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            lhs-mcp-v3-${{ runner.os }}-${{ github.ref_name }}-
      - name: Generate machine-readable repository index
        shell: bash
        run: |
          set -euo pipefail
          SCOPE="."
          if [[ "${{ inputs.scope || 'repository' }}" == "game" ]]; then
            SCOPE="games/lan_house_simulator"
          fi
          node tools/lhs-mcp/index.mjs --scope "$SCOPE" --previous out/lhs-mcp-cache/catalog.json --output out/lhs-mcp-index/catalog.json
          mkdir -p out/lhs-mcp-cache
          cp out/lhs-mcp-index/catalog.json out/lhs-mcp-cache/catalog.json
      - name: Cache updated catalog for next push
        if: ${{ steps.cache-index.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: out/lhs-mcp-cache/catalog.json
          key: lhs-mcp-v3-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
      - name: Verify live MCP tools against checked out game
        if: ${{ inputs.scope != 'game' }}
        run: node tools/lhs-mcp/smoke.mjs
      - name: Upload indexed files, symbols and summary
        uses: actions/upload-artifact@v4
        with:
          name: lhs-mcp-catalog
          path: out/lhs-mcp-index/
          retention-days: 30
          if-no-files-found: error
