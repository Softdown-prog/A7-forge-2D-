name: LHS - validar e publicar main no Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'games/lan_house_simulator/**'
      - '.github/workflows/lhs-pages-sync.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'SHA completo já mesclado na main e aprovado para publicação'
        required: true
        type: string
      approve_production:
        description: 'Confirmo a autorização de publicação em produção'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lhs-pages-production-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.approve_production == true)) }}
    environment: lhs-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
      RELEASE_TRIGGER: ${{ github.event_name }}
    steps:
      - name: Obter o commit que disparou a publicação
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Validar SHA do commit na história da main
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compilar e validar o site
        working-directory: source/games/lan_house_simulator
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix frontend-angular --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build:site
          npm run check:site
          node --test tests/multiroom-collision.test.mjs tests/customer-stall-recovery.test.mjs tests/customer-feedback.test.mjs tests/website.test.mjs tests/account-client.test.mjs tests/donate.test.mjs tests/email-confirmation.test.mjs tests/privacy-notice.test.mjs tests/customer-choices.test.mjs tests/customer-spending.test.mjs tests/merchandise.test.mjs tests/ps1-2002.test.mjs tests/counter-queue.test.mjs tests/canonical-site-delivery.test.mjs

      - name: Conferir abertura real antes de publicar
        working-directory: source/games/lan_house_simulator
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/verify_live_site_preview.mjs
          # Gate obrigatório: Chromium executa o mesmo out/site que será
          # sincronizado ao Cloudflare (CSP, Angular e Canvas reais).
          LHS_CHECK_DEFAULT_SITE=1 node frontend-angular/scripts/verify_full_site.mjs
          node scripts/verify_account_navigation.mjs
          # Os testes abaixo abrem dist/index.html (fallback React).
          # O site Angular compilado e validado permanece intacto em out/site/.
          npm run build
          node scripts/verify_cookie_notice.mjs
          node scripts/verify_hardware_scroll.mjs
          node scripts/verify_management_panels.mjs
          node scripts/verify_merchandise.mjs out/release-merchandise
          node scripts/verify_ps1_2002.mjs out/release-ps1
          node scripts/verify_financial_clarity.mjs out/release-finance
          node scripts/verify_save_on_menu.mjs out/release-save
          node scripts/verify_doorway_recovery.mjs
          node scripts/verify_doorway_recovery.mjs out/corridor --corridor

      - name: Anexar evidências do navegador Angular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhs-angular-release-browser-gate
          path: source/games/lan_house_simulator/out/angular-site-default-browser
          if-no-files-found: ignore

      - name: Evitar que um push antigo substitua uma versão nova
        id: release_guard
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_TRIGGER" = 'push' ]; then
            CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
            [[ "$CURRENT_MAIN" =~ ^[0-9a-f]{40}$ ]]
            if [ "$CURRENT_MAIN" != "$SOURCE_SHA" ]; then
              echo "::notice::A main avançou; a revisão mais nova fará a publicação."
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Conferir credencial dedicada do espelho
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          MIRROR_KEY: ${{ secrets.LHS_PAGES_MIRROR_SSH_KEY }}
        run: |
          if [ -z "$MIRROR_KEY" ]; then
            echo 'Configure o segredo LHS_PAGES_MIRROR_SSH_KEY.' >&2
            exit 1
          fi

      - name: Obter o repositório ligado ao Pages
        if: steps.release_guard.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          repository: Softdown-prog/a7-forge-2d
          ref: main
          path: mirror
          ssh-key: ${{ secrets.LHS_PAGES_MIRROR_SSH_KEY }}
          ssh-strict: true

      - name: Sincronizar somente o LHS e publicar
        if: steps.release_guard.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_TRIGGER" = 'push' ]; then
            CURRENT_MAIN="$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin refs/heads/main | cut -f1)"
            [[ "$CURRENT_MAIN" =~ ^[0-9a-f]{40}$ ]]
            if [ "$CURRENT_MAIN" != "$SOURCE_SHA" ]; then
              echo '::notice::Um novo commit chegou antes da sincronização; publicação antiga ignorada.'
              exit 0
            fi
          fi
          mkdir -p mirror/games/lan_house_simulator
          rsync -a --checksum --delete \
            --exclude 'node_modules/' --exclude 'dist/' --exclude 'out/' --exclude '.angular/' --exclude '.angular-browser-tools/' \
            source/games/lan_house_simulator/ mirror/games/lan_house_simulator/
          node source/games/lan_house_simulator/scripts/prepare_pages_artifact.mjs mirror/games/lan_house_simulator
          cd mirror
          printf '%s\n' "$SOURCE_SHA" > .lhs-upstream-sha
          git add -A games/lan_house_simulator .lhs-upstream-sha
          git add -f games/lan_house_simulator/out/site
          if git diff --cached --quiet; then
            echo 'Este commit já está sincronizado.'
            exit 0
          fi
          if git diff --cached --quiet -- games/lan_house_simulator; then
            MESSAGE="[CF-Pages-Skip] sync(lhs): atualizar origem ${SOURCE_SHA:0:12}"
          else
            MESSAGE="sync(lhs): publicar main ${SOURCE_SHA:0:12}"
          fi
          if [ "$RELEASE_TRIGGER" = 'push' ]; then
            CURRENT_MAIN="$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin refs/heads/main | cut -f1)"
            [[ "$CURRENT_MAIN" =~ ^[0-9a-f]{40}$ && "$CURRENT_MAIN" = "$SOURCE_SHA" ]] || {
              echo '::notice::A main avançou durante a preparação; a publicação antiga será ignorada.'
              exit 0
            }
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "$MESSAGE"
          git push origin HEAD:main
