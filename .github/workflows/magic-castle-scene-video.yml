name: Magic Castle scene video
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/magic_castle/scripts/record_scene.mjs'
      - '.github/workflows/magic-castle-scene-video.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering tools
        run: |
          python -m pip install -e tools/visitor_forge_2d
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Test projectile physics
        run: node --test games/magic_castle/tests/*.test.cjs
      - name: Render game-owned wizard assets
        run: python -m visitor_forge_2d render-pixel-character --recipe games/magic_castle/authoring/wizard/pixel_character_wizard_mini_01.json --output out/wizard
      - name: Stage playable scene
        run: |
          mkdir -p out/magic_castle/assets/wizard
          cp games/magic_castle/{index.html,style.css,game.js,combat.js,enemy_ai.js} out/magic_castle/
          cp out/wizard/frames/*.png out/magic_castle/assets/wizard/
          cp -R games/magic_castle/assets/{enemies,scene} out/magic_castle/assets/
      - name: Record real gameplay
        run: node games/magic_castle/scripts/record_scene.mjs out/magic_castle out/magic_castle_video
      - uses: actions/upload-artifact@v4
        with:
          name: magic-castle-scene-01-mp4
          path: out/magic_castle_video/
          if-no-files-found: error
