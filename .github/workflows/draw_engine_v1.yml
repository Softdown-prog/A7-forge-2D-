name: Validate A7 Draw Engine V1

on:
  push:
    paths:
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/brush_engine_v2.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/node_graph.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/graph_scenery.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/graph_worker.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/brush_library/**'
      - 'tools/visitor_forge_2d/examples/park_tree_brush_graph_pilot_01.json'
      - 'tools/visitor_forge_2d/tests/test_node_graph_v1.py'
      - '.github/workflows/draw_engine_v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pillow pytest
      - name: Run Draw Engine V1 tests
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: python -m pytest -q tools/visitor_forge_2d/tests/test_node_graph_v1.py
      - name: Render node-graph tree pilot
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from visitor_forge_2d.graph_worker import run_graph_workers
          recipe = Path('tools/visitor_forge_2d/examples/park_tree_brush_graph_pilot_01.json')
          result = run_graph_workers(recipe, Path('rendered_draw_engine_v1'))
          print(result)
          PY
      - name: Upload Draw Engine V1 pilot
        uses: actions/upload-artifact@v4
        with:
          name: a7-draw-engine-v1-tree-pilot
          path: rendered_draw_engine_v1/
          if-no-files-found: error
