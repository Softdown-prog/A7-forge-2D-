name: Validate A7 Draw Engine V2

on:
  push:
    paths:
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/brush_engine_v2.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/brush_engine_v3.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/dynamics_mapping.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/sensor_context.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/brush_option_bindings.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/mapped_brush_engine.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/dab_density.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/cluster_engine.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/geometry_engine.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/distribution_engine.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/node_graph.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/core/graph_scenery.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/graph_worker.py'
      - 'tools/visitor_forge_2d/src/visitor_forge_2d/brush_library/**'
      - 'tools/visitor_forge_2d/examples/park_tree_brush_graph_pilot_01.json'
      - 'tools/visitor_forge_2d/examples/draw_engine_cluster_pilot_01.json'
      - 'tools/visitor_forge_2d/tests/test_node_graph_v1.py'
      - 'tools/visitor_forge_2d/tests/test_dynamics_mapping.py'
      - 'tools/visitor_forge_2d/tests/test_mapped_brush_engine.py'
      - 'tools/visitor_forge_2d/tests/test_dab_density.py'
      - 'tools/visitor_forge_2d/tests/test_sensor_context.py'
      - 'tools/visitor_forge_2d/docs/A7_DRAW_ENGINE_V2.md'
      - 'tools/visitor_forge_2d/docs/OPEN_SOURCE_REFERENCE_MATRIX.md'
      - 'tools/visitor_forge_2d/third_party/**'
      - '.github/workflows/draw_engine_v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pillow pytest
      - name: Run Draw Engine V2 tests
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python -m pytest -q \
            tools/visitor_forge_2d/tests/test_node_graph_v1.py \
            tools/visitor_forge_2d/tests/test_dynamics_mapping.py \
            tools/visitor_forge_2d/tests/test_mapped_brush_engine.py \
            tools/visitor_forge_2d/tests/test_dab_density.py \
            tools/visitor_forge_2d/tests/test_sensor_context.py
      - name: Render legacy compatibility pilot
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from visitor_forge_2d.graph_worker import run_graph_workers
          result = run_graph_workers(
              Path('tools/visitor_forge_2d/examples/park_tree_brush_graph_pilot_01.json'),
              Path('rendered_draw_engine_v1'),
          )
          print(result)
          PY
      - name: Render hierarchical cluster pilot
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from visitor_forge_2d.graph_worker import run_graph_workers
          result = run_graph_workers(
              Path('tools/visitor_forge_2d/examples/draw_engine_cluster_pilot_01.json'),
              Path('rendered_draw_engine_v2'),
          )
          print(result)
          PY
      - name: Upload compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7-draw-engine-v1-compatibility-pilot
          path: rendered_draw_engine_v1/
          if-no-files-found: error
      - name: Upload V2 hierarchical cluster pilot
        uses: actions/upload-artifact@v4
        with:
          name: a7-draw-engine-v2-cluster-pilot
          path: rendered_draw_engine_v2/
          if-no-files-found: error
