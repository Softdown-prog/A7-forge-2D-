name: Validate A7 Draw Engine V2

on:
  push:
    paths:
      - 'tools/visitor_forge_2d/**'
      - '.github/workflows/draw_engine_v1.yml'
  pull_request:
    paths:
      - 'tools/visitor_forge_2d/**'
      - '.github/workflows/draw_engine_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e tools/visitor_forge_2d pytest
      - name: Run Draw Engine V2 tests
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python -m pytest -q tools/visitor_forge_2d/tests
      - name: Build and test the portable wheel outside the checkout
        run: |
          python -m pip wheel --no-deps tools/visitor_forge_2d -w out/a7-wheel
          python tools/visitor_forge_2d/tests/wheel_smoke.py \
            --wheel-dir out/a7-wheel \
            --recipe tools/visitor_forge_2d/examples/draw_engine_field_tree_pilot_01.json \
            --output out/a7-package-smoke
      - name: Render legacy compatibility pilot
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from visitor_forge_2d.graph_worker import run_graph_workers
          result = run_graph_workers(
              Path('tools/visitor_forge_2d/examples/park_tree_brush_graph_pilot_01.json'),
              Path('rendered_draw_engine_v1'),
          )
          print(result)
          PY
      - name: Render hierarchical cluster pilot
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from visitor_forge_2d.graph_worker import run_graph_workers
          result = run_graph_workers(
              Path('tools/visitor_forge_2d/examples/draw_engine_cluster_pilot_01.json'),
              Path('rendered_draw_engine_v2'),
          )
          print(result)
          PY
      - name: Render field-aware tree pilot
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from visitor_forge_2d.graph_worker import run_graph_workers
          result = run_graph_workers(
              Path('tools/visitor_forge_2d/examples/draw_engine_field_tree_pilot_01.json'),
              Path('rendered_draw_engine_fields'),
          )
          print(result)
          PY
      - name: Render semantic four-view plant planner pilot
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from visitor_forge_2d.plant_planner_worker import run_plant_planner
          result = run_plant_planner(
              Path('tools/visitor_forge_2d/examples/plant_intent_ipe_planner_pilot_01.json'),
              Path('rendered_plant_planner'),
          )
          print(result)
          PY
      - name: Render flowering reference and check actual crown colors
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: |
          python tools/visitor_forge_2d/tests/reference_render_smoke.py \
            tools/visitor_forge_2d/examples/plant_intent_ipe_reference_01.json \
            rendered_flowering_reference
      - name: Upload flowering reference comparison output
        uses: actions/upload-artifact@v4
        with:
          name: a7-flowering-reference-four-views
          path: rendered_flowering_reference/
          if-no-files-found: error
      - name: Upload compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7-draw-engine-v1-compatibility-pilot
          path: rendered_draw_engine_v1/
          if-no-files-found: error
      - name: Upload V2 hierarchical cluster pilot
        uses: actions/upload-artifact@v4
        with:
          name: a7-draw-engine-v2-cluster-pilot
          path: rendered_draw_engine_v2/
          if-no-files-found: error
      - name: Upload field-aware tree pilot
        uses: actions/upload-artifact@v4
        with:
          name: a7-draw-engine-v2-field-tree-pilot
          path: rendered_draw_engine_fields/
          if-no-files-found: error
      - name: Upload semantic four-view plant planner pilot
        uses: actions/upload-artifact@v4
        with:
          name: a7-plant-art-planner-v1-four-view-pilot
          path: rendered_plant_planner/
          if-no-files-found: error
      - name: Upload portable package smoke output
        uses: actions/upload-artifact@v4
        with:
          name: a7-portable-package-smoke
          path: out/a7-package-smoke/
          if-no-files-found: error
