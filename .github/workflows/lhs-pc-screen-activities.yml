name: LHS - Animated PC Screens
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/lan_house_simulator/src/render/pcScreenActivities.ts'
      - 'games/lan_house_simulator/src/render/retroComputer.ts'
      - 'games/lan_house_simulator/tests/pc-screen-activities.test.mjs'
      - 'games/lan_house_simulator/scripts/render_pc_screen_activities.mjs'
      - '.github/workflows/lhs-pc-screen-activities.yml'
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-latest
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  animated-pc-screens:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project
        working-directory: games/lan_house_simulator
        run: npm ci --no-audit --no-fund
      - name: Compile game
        working-directory: games/lan_house_simulator
        run: npm run build
      - name: Test stable screen selection, animations and performance limits
        working-directory: games/lan_house_simulator
        run: node --test tests/pc-screen-activities.test.mjs
      - name: Install headless browser
        working-directory: games/lan_house_simulator
        run: |
          # ubuntu-latest is Ubuntu 26.04, which Playwright supports from 1.61 (1.56.1 fails
          # with "does not support chromium on ubuntu26.04-x64"). The workflows pinned to
          # ubuntu-24.04 keep 1.56.1.
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Capture six monitor screens with actual game renderer
        working-directory: games/lan_house_simulator
        run: node scripts/render_pc_screen_activities.mjs out/pc-screen-art
      - name: Encode preview MP4
        working-directory: games/lan_house_simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y -i out/pc-screen-art/pc_seis_atividades_crt_lcd.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 22 \
            -movflags +faststart out/pc-screen-art/pc_seis_atividades_crt_lcd.mp4
          test -s out/pc-screen-art/pc_seis_atividades_crt_lcd.png
          test -s out/pc-screen-art/pc_seis_atividades_crt_lcd.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: lhs-animated-crt-lcd-screens
          path: |
            games/lan_house_simulator/out/pc-screen-art/pc_seis_atividades_crt_lcd.png
            games/lan_house_simulator/out/pc-screen-art/pc_seis_atividades_crt_lcd.mp4
          retention-days: 30
          if-no-files-found: error
