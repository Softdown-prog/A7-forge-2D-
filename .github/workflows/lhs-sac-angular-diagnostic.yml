name: LHS SAC Angular diagnosis (GitHub Actions only)
on:
  pull_request:
    paths:
      - 'games/lan_house_simulator/frontend-angular/**'
      - 'games/lan_house_simulator/scripts/sac_diagnose_site_rewrite.mjs'
      - 'games/lan_house_simulator/scripts/sac_site_rewrite_entry.mjs'
      - 'games/lan_house_simulator/tests/sac-site-rewrite-entry.test.mjs'
      - '.github/workflows/lhs-sac-angular-diagnostic.yml'
  push:
    branches: ['feat/lhs-sac-actions-diagnostic', 'feat/lhs-angular-next-stage-20261101']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-24.04
      requires_docker: true
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  site-rewrite:
    name: SAC pre/build/post/Guardian on LHS site-rewrite
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 30
    steps:
      - name: Checkout LHS
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned SAC revision
        uses: actions/checkout@v4
        with:
          repository: Softdown-prog/Data_libray
          ref: 98ca6986b79fa81f6a1595fb8a6d4950c757fe86
          path: .sac-toolchain
          persist-credentials: false
      - name: Assert current pinned SAC checkout
        shell: bash
        run: test "$(git -C .sac-toolchain rev-parse HEAD)" = '98ca6986b79fa81f6a1595fb8a6d4950c757fe86'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install SAC tooling
        run: |
          npm ci --prefix .sac-toolchain/packages/angular-core --ignore-scripts --no-audit --no-fund
          npm ci --prefix .sac-toolchain/packages/angular-precompiler --ignore-scripts --no-audit --no-fund
          npm ci --prefix .sac-toolchain/packages/angular-postcompiler --ignore-scripts --no-audit --no-fund
          npm install --prefix .sac-toolchain/packages/angular-guardian --ignore-scripts --no-audit --no-fund
      - name: Install SAC trusted TypeScript parser for Canvas inventory
        run: npm ci --prefix .sac-toolchain/packages/angular-postcompiler/smoke --ignore-scripts --no-audit --no-fund
      - name: Scan real LHS procedural and Canvas sources without executing the game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/lan_house_simulator/out/sac-angular-site-rewrite
          node .sac-toolchain/packages/sac-multistack/bin/canvas-stream.mjs . games/lan_house_simulator \
            > games/lan_house_simulator/out/sac-angular-site-rewrite/canvas-source.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const report=JSON.parse(readFileSync(process.argv[1],"utf8"));
            assert.equal(report.scan_completed,true);
            assert.equal(report.inventory.parse_error_files,0);
            assert.ok(report.inventory.source_files>=300,"missing game source coverage");
            assert.equal(report.status,"unverified","static scan is not a gameplay approval");
            assert.equal(report.runtime_verified,false);
            assert.equal(report.deployment_authorized,false);
            console.log("SAC Canvas source inventory:",report.inventory.source_files,
              "sources, no parse errors; runtime remains unverified");
          ' games/lan_house_simulator/out/sac-angular-site-rewrite/canvas-source.json
      - name: Install LHS Angular
        run: npm ci --prefix games/lan_house_simulator/frontend-angular --no-audit --no-fund
      - name: Verify SAC hash-entrypoint contract and harness syntax
        run: |
          node --check games/lan_house_simulator/scripts/sac_diagnose_site_rewrite.mjs
          node --test games/lan_house_simulator/tests/sac-site-rewrite-entry.test.mjs
      - name: Pull reviewed Chromium sandbox image by digest
        run: docker pull "mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea"
      - name: SAC preflight, Angular AOT build, postflight and isolated Guardian
        env:
          SAC_SANDBOX_IMAGE: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: node games/lan_house_simulator/scripts/sac_diagnose_site_rewrite.mjs
      - name: Upload sanitized diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhs-angular-sac-diagnostic
          path: |
            games/lan_house_simulator/out/sac-angular-site-rewrite/report.json
            games/lan_house_simulator/out/sac-angular-site-rewrite/canvas-source.json
          retention-days: 14
          if-no-files-found: warn
