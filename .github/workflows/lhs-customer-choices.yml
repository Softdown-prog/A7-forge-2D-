name: LHS - Customer Decision Tree
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/lan_house_simulator/src/sim/customerChoices.ts'
      - 'games/lan_house_simulator/src/sim/customerFeedback.ts'
      - 'games/lan_house_simulator/src/ui/customerFeedbackPanel.ts'
      - 'games/lan_house_simulator/tests/customer-feedback.test.mjs'
      - 'games/lan_house_simulator/src/sim/engine.ts'
      - 'games/lan_house_simulator/src/sim/needs.ts'
      - 'games/lan_house_simulator/src/sim/types.ts'
      - 'games/lan_house_simulator/tests/customer-choices.test.mjs'
      - 'games/lan_house_simulator/tests/customer-preferences.test.mjs'
      - 'games/lan_house_simulator/tests/customer-spending.test.mjs'
      - 'games/lan_house_simulator/tests/ps1-2002.test.mjs'
      - '.github/workflows/lhs-customer-choices.yml'
  pull_request:
    paths:
      - 'games/lan_house_simulator/src/sim/customerChoices.ts'
      - 'games/lan_house_simulator/src/sim/customerFeedback.ts'
      - 'games/lan_house_simulator/src/ui/customerFeedbackPanel.ts'
      - 'games/lan_house_simulator/tests/customer-feedback.test.mjs'
      - 'games/lan_house_simulator/src/sim/engine.ts'
      - 'games/lan_house_simulator/src/sim/needs.ts'
      - 'games/lan_house_simulator/src/sim/types.ts'
      - 'games/lan_house_simulator/tests/customer-choices.test.mjs'
      - 'games/lan_house_simulator/tests/customer-preferences.test.mjs'
      - 'games/lan_house_simulator/tests/customer-spending.test.mjs'
      - 'games/lan_house_simulator/tests/ps1-2002.test.mjs'
      - '.github/workflows/lhs-customer-choices.yml'
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/lhs-runner-route.yml
    with:
      hosted_label: ubuntu-latest
    secrets:
      runner_status_token: ${{ secrets.LHS_RUNNER_STATUS_TOKEN }}

  customer-decisions:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile TypeScript and verify customer choices
        working-directory: games/lan_house_simulator
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test tests/customer-feedback.test.mjs tests/customer-choices.test.mjs tests/customer-preferences.test.mjs tests/customer-spending.test.mjs tests/counter-queue.test.mjs tests/ps1-2002.test.mjs tests/doorway-recovery.test.mjs
