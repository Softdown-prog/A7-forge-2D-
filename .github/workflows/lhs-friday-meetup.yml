name: LHS - First Friday foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/lan_house_simulator/src/sim/campaignWeek.ts'
      - 'games/lan_house_simulator/src/sim/futureNightClock.ts'
      - 'games/lan_house_simulator/src/sim/nightMeetup.ts'
      - 'games/lan_house_simulator/tests/night-meetup.test.mjs'
      - 'games/lan_house_simulator/tests/future-night-clock.test.mjs'
      - 'games/lan_house_simulator/src/sim/fridayMeetup.ts'
      - 'games/lan_house_simulator/src/sim/multiplayerVisitors.ts'
      - 'games/lan_house_simulator/src/sim/types.ts'
      - 'games/lan_house_simulator/src/ui/fridayMeetupPanel.ts'
      - 'games/lan_house_simulator/src/ui/managementPanels.ts'
      - 'games/lan_house_simulator/src/ui/timeWeatherPanel.ts'
      - 'games/lan_house_simulator/tests/friday-meetup.test.mjs'
      - 'games/lan_house_simulator/scripts/verify_friday_panel.mjs'
      - '.github/workflows/lhs-friday-meetup.yml'
permissions:
  contents: read
jobs:
  friday-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original simulator
        working-directory: games/lan_house_simulator
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check Fridays, saved drafts, multiplayer and normal clock
        working-directory: games/lan_house_simulator
        run: node --test tests/friday-meetup.test.mjs tests/night-meetup.test.mjs tests/future-night-clock.test.mjs tests/time-weather-hud.test.mjs tests/multiplayer-visitors.test.mjs
      - name: Install Chromium for genuine administration UI
        working-directory: games/lan_house_simulator
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect first Friday panel, persistent draft and cancellation
        working-directory: games/lan_house_simulator
        run: node scripts/verify_friday_panel.mjs out/friday-panel
      - name: Store actual UI screenshot and test verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhs-primeira-sexta-painel-real
          path: games/lan_house_simulator/out/friday-panel/
          retention-days: 14
          if-no-files-found: warn
